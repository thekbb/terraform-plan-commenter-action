name: End-to-End Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare unique fixture directory
        id: fixture
        run: bash scripts/e2e/prepare-runtime-fixture.sh fixtures/e2e/runtime-smoke

      - name: Run action once
        id: first
        uses: ./
        env:
          COMMENT_NOTE: |
            Automated end-to-end smoke test. This verifies the normal successful plan path and comment update behavior.
            Expected to persist on the pull request and be updated by later runs of this same test.
        with:
          working-directory: ${{ steps.fixture.outputs.fixture_dir }}
          terraform-version: '1.14.3'
          github-token: ${{ github.token }}

      - name: Assert first action outputs
        shell: bash
        env:
          PLAN_EXIT_CODE: ${{ steps.first.outputs.plan-exit-code }}
          HAS_CHANGES: ${{ steps.first.outputs.has-changes }}
        run: bash scripts/e2e/assert-action-result.sh 2 true

      - name: Run action twice to exercise comment update
        if: github.event_name == 'pull_request'
        id: second
        uses: ./
        env:
          COMMENT_NOTE: |
            Automated end-to-end smoke test. This verifies the normal successful plan path and comment update behavior.
            Expected to persist on the pull request and be updated by later runs of this same test.
        with:
          working-directory: ${{ steps.fixture.outputs.fixture_dir }}
          terraform-version: '1.14.3'
          github-token: ${{ github.token }}

      - name: Assert second action outputs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PLAN_EXIT_CODE: ${{ steps.second.outputs.plan-exit-code }}
          HAS_CHANGES: ${{ steps.second.outputs.has-changes }}
        run: bash scripts/e2e/assert-action-result.sh 2 true

      - name: Assert exactly one PR comment exists for this fixture
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIXTURE_DIR: ${{ steps.fixture.outputs.fixture_dir }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTATIONS_JSON: >
            [
              {
                "workspace": "default",
                "includes": [
                  "### Terraform Plan",
                  "Automated end-to-end smoke test. This verifies the normal successful plan path and comment update behavior.",
                  "Plan: 1 to add, 0 to change, 0 to destroy."
                ]
              }
            ]
        run: node scripts/e2e/assert-pr-comments.mjs

  workspace-isolation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare unique fixture directory
        id: fixture
        run: bash scripts/e2e/prepare-runtime-fixture.sh fixtures/e2e/runtime-workspace

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.3'
          terraform_wrapper: false

      - name: Initialize Terraform for workspace switching
        shell: bash
        working-directory: ${{ steps.fixture.outputs.fixture_dir }}
        run: terraform init -input=false

      - name: Select dev workspace
        env:
          FIXTURE_DIR: ${{ steps.fixture.outputs.fixture_dir }}
        run: bash scripts/e2e/select-workspace.sh "$FIXTURE_DIR" dev

      - name: Run action in dev workspace
        id: dev
        uses: ./
        env:
          COMMENT_NOTE: |
            Automated end-to-end workspace isolation test for the `dev` workspace.
            Expected to persist on the pull request separately from the `staging` workspace comment.
        with:
          working-directory: ${{ steps.fixture.outputs.fixture_dir }}
          setup-terraform: 'false'
          github-token: ${{ github.token }}

      - name: Assert dev workspace outputs
        shell: bash
        env:
          PLAN_EXIT_CODE: ${{ steps.dev.outputs.plan-exit-code }}
          HAS_CHANGES: ${{ steps.dev.outputs.has-changes }}
        run: bash scripts/e2e/assert-action-result.sh 2 true

      - name: Select staging workspace
        env:
          FIXTURE_DIR: ${{ steps.fixture.outputs.fixture_dir }}
        run: bash scripts/e2e/select-workspace.sh "$FIXTURE_DIR" staging

      - name: Run action in staging workspace
        id: staging
        uses: ./
        env:
          COMMENT_NOTE: |
            Automated end-to-end workspace isolation test for the `staging` workspace.
            Expected to persist on the pull request separately from the `dev` workspace comment.
        with:
          working-directory: ${{ steps.fixture.outputs.fixture_dir }}
          setup-terraform: 'false'
          github-token: ${{ github.token }}

      - name: Assert staging workspace outputs
        shell: bash
        env:
          PLAN_EXIT_CODE: ${{ steps.staging.outputs.plan-exit-code }}
          HAS_CHANGES: ${{ steps.staging.outputs.has-changes }}
        run: bash scripts/e2e/assert-action-result.sh 2 true

      - name: Assert distinct PR comments exist per workspace
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIXTURE_DIR: ${{ steps.fixture.outputs.fixture_dir }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTATIONS_JSON: >
            [
              {
                "workspace": "dev",
                "label": "dev workspace comment",
                "includes": [
                  "### Terraform Plan",
                  "Automated end-to-end workspace isolation test for the `dev` workspace.",
                  "Plan: 1 to add, 0 to change, 0 to destroy."
                ]
              },
              {
                "workspace": "staging",
                "label": "staging workspace comment",
                "includes": [
                  "### Terraform Plan",
                  "Automated end-to-end workspace isolation test for the `staging` workspace.",
                  "Plan: 1 to add, 0 to change, 0 to destroy."
                ]
              }
            ]
        run: node scripts/e2e/assert-pr-comments.mjs

  large-plan-truncation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate a large Terraform fixture
        id: fixture
        run: bash scripts/e2e/generate-large-plan-fixture.sh fixtures/e2e/runtime-large-plan 1500

      - name: Run action against the large fixture
        id: plan
        uses: ./
        env:
          COMMENT_NOTE: |
            Automated end-to-end large-plan truncation test. This verifies the oversized comment fallback and workflow-run link.
            Expected to persist on the pull request and be updated by later runs of this same test.
        with:
          working-directory: ${{ steps.fixture.outputs.fixture_dir }}
          terraform-version: '1.14.3'
          github-token: ${{ github.token }}

      - name: Assert action outputs
        shell: bash
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.plan-exit-code }}
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
        run: bash scripts/e2e/assert-action-result.sh 2 true

      - name: Assert the PR comment took the truncation path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIXTURE_DIR: ${{ steps.fixture.outputs.fixture_dir }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTATIONS_JSON: >
            [
              {
                "workspace": "default",
                "includes": [
                  "Plan output is too large for GitHub comment",
                  "Automated end-to-end large-plan truncation test. This verifies the oversized comment fallback and workflow-run link.",
                  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "🟢 <strong>create</strong> <code>1500</code>"
                ]
              }
            ]
        run: node scripts/e2e/assert-pr-comments.mjs

  plan-failure:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run action against a failing fixture
        id: failure
        continue-on-error: true
        uses: ./
        env:
          COMMENT_NOTE: |
            Automated end-to-end plan-failure test. This verifies the failed-plan path and failure-style comment behavior.
            Expected to persist on the pull request and be updated by later runs of this same test.
        with:
          working-directory: fixtures/e2e/plan-failure
          terraform-version: '1.14.3'
          github-token: ${{ github.token }}

      - name: Assert failure outputs and action result
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.failure.outcome }}
          PLAN_EXIT_CODE: ${{ steps.failure.outputs.plan-exit-code }}
          HAS_CHANGES: ${{ steps.failure.outputs.has-changes }}
        run: bash scripts/e2e/assert-action-result.sh 1 false failure

      - name: Assert the PR comment reflects a failed plan
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIXTURE_DIR: fixtures/e2e/plan-failure
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTATIONS_JSON: >
            [
              {
                "workspace": "default",
                "includes": [
                  "### Terraform Plan",
                  "❌ Plan failed",
                  "Automated end-to-end plan-failure test. This verifies the failed-plan path and failure-style comment behavior."
                ],
                "excludes": [
                  "✅ No changes"
                ]
              }
            ]
        run: node scripts/e2e/assert-pr-comments.mjs
