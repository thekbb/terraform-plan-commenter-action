name: Publish Verified Release

on:
  repository_dispatch:
    types: [publish_verified_release]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate dispatch payload
        env:
          TAG: ${{ github.event.client_payload.tag }}
          VERIFIED_REF: ${{ github.event.client_payload.verified_ref }}
          VERIFIED_RUN_ID: ${{ github.event.client_payload.verified_run_id }}
          VERIFIED_SHA: ${{ github.event.client_payload.verified_sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semver tag like v2.0.0, got: $TAG"
            exit 1
          fi

          if [[ "$VERIFIED_REF" != "refs/tags/$TAG" ]]; then
            echo "Dispatch payload ref $VERIFIED_REF does not match $TAG."
            exit 1
          fi

          if [[ -z "$VERIFIED_RUN_ID" ]]; then
            echo "Missing verified_run_id in dispatch payload."
            exit 1
          fi

          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Missing or invalid verified_sha in dispatch payload."
            exit 1
          fi

      - name: Verify referenced workflow run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PREP_PAT != '' && secrets.RELEASE_PREP_PAT || github.token }}
          TAG: ${{ github.event.client_payload.tag }}
          VERIFIED_RUN_ID: ${{ github.event.client_payload.verified_run_id }}
          VERIFIED_SHA: ${{ github.event.client_payload.verified_sha }}
        run: |
          run_json="$(gh api --hostname github.com "/repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_RUN_ID}")"

          run_name="$(jq -r '.name // empty' <<<"$run_json")"
          run_event="$(jq -r '.event // empty' <<<"$run_json")"
          run_status="$(jq -r '.status // empty' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          run_head_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          run_head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"

          if [[ "$run_name" != "Verify Draft Release" ]]; then
            echo "Workflow run ${VERIFIED_RUN_ID} is ${run_name:-unnamed}, not Verify Draft Release."
            exit 1
          fi

          if [[ "$run_event" != "workflow_dispatch" ]]; then
            echo "Workflow run ${VERIFIED_RUN_ID} was triggered by ${run_event:-unknown}, not workflow_dispatch."
            exit 1
          fi

          if [[ "$run_status" != "completed" || "$run_conclusion" != "success" ]]; then
            echo "Workflow run ${VERIFIED_RUN_ID} is ${run_status:-unknown}/${run_conclusion:-unknown}, not completed/success."
            exit 1
          fi

          if [[ "$run_head_branch" != "$TAG" ]]; then
            echo "Workflow run ${VERIFIED_RUN_ID} was recorded on ${run_head_branch:-unknown}, not ${TAG}."
            exit 1
          fi

          if [[ "$run_head_sha" != "$VERIFIED_SHA" ]]; then
            echo "Workflow run ${VERIFIED_RUN_ID} head SHA ${run_head_sha:-unknown} does not match verified SHA ${VERIFIED_SHA}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify signed tag and release metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PREP_PAT != '' && secrets.RELEASE_PREP_PAT || github.token }}
          TAG: ${{ github.event.client_payload.tag }}
          VERIFIED_SHA: ${{ github.event.client_payload.verified_sha }}
        run: |
          version="${TAG#v}"

          node scripts/verify-release.ts tag "$TAG"

          tag_commit="$(git rev-list -n 1 "$TAG")"
          head_commit="$(git rev-parse HEAD)"

          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit does not match $TAG."
            exit 1
          fi

          if [[ "$tag_commit" != "$VERIFIED_SHA" ]]; then
            echo "Tagged commit $tag_commit does not match verified SHA $VERIFIED_SHA."
            exit 1
          fi

          node scripts/verify-release.ts commit "$GITHUB_REPOSITORY" "$tag_commit" "$TAG"

          git fetch origin main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tagged commit $tag_commit is not reachable from origin/main."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version ($package_version) does not match $TAG."
            exit 1
          fi

          if [[ "$lock_version" != "$version" ]]; then
            echo "package-lock.json version ($lock_version) does not match $TAG."
            exit 1
          fi

          if ! grep -Fq "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for $version."
            exit 1
          fi

          is_draft="$(gh release view "$TAG" --repo "github.com/$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Expected a draft release for $TAG before publishing."
            exit 1
          fi

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PREP_PAT != '' && secrets.RELEASE_PREP_PAT || github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release edit "$TAG" --repo "github.com/$GITHUB_REPOSITORY" --draft=false

      - name: Verify published release is immutable
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PREP_PAT != '' && secrets.RELEASE_PREP_PAT || github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            is_draft="$(gh release view "$TAG" --repo "github.com/$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            is_immutable="$(gh release view "$TAG" --repo "github.com/$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')"

            if [[ "$is_draft" == "false" && "$is_immutable" == "true" ]]; then
              exit 0
            fi

            if [[ "$attempt" -lt 5 ]]; then
              sleep 2
            fi
          done

          echo "Published release $TAG is not immutable."
          echo "Expected isDraft=false and isImmutable=true after publishing."
          echo "Enable GitHub release immutability for this repository before publishing releases."
          exit 1
