name: 'Terraform Plan Commenter'
description: 'Run terraform plan and post a formatted comment to the PR with summary badges'
author: 'thekbb'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  working-directory:
    description: 'Directory containing Terraform configuration'
    required: false
    default: '.'
  terraform-version:
    description: 'Terraform version to use'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}
  setup-terraform:
    description: 'Whether to setup Terraform (set to false if already configured)'
    required: false
    default: 'true'
  init-args:
    description: 'Trusted-only additional arguments for terraform init'
    required: false
    default: ''
  plan-args:
    description: 'Trusted-only additional arguments for terraform plan'
    required: false
    default: ''
  summary-theme:
    description: 'Emoji theme for summary: default, colorblind, or minimal'
    required: false
    default: 'default'

outputs:
  plan-exit-code:
    description: 'Exit code from terraform plan (0=no changes, 1=error, 2=changes)'
    value: ${{ steps.plan.outputs.exitcode }}
  has-changes:
    description: 'Whether the plan has changes (true/false)'
    value: ${{ steps.plan.outputs.exitcode == '2' }}

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      if: inputs.setup-terraform == 'true'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false  # We capture output ourselves

    - name: Terraform Init
      id: init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_CLI_ARGS_init: ${{ inputs.init-args }}
      run: terraform init -input=false

    - name: Terraform Plan
      id: plan
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIR: ${{ inputs.working-directory }}
        TF_CLI_ARGS_plan: ${{ inputs.plan-args }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const { pathToFileURL } = require('url');
          const scriptPath = path.join(process.env.ACTION_PATH, 'dist', 'run-terraform-plan.js');
          const { default: runTerraformPlan } = await import(pathToFileURL(scriptPath).href);
          await runTerraformPlan({ core });

    - name: Post PR Comment
      if: >-
        github.event_name == 'pull_request' && steps.plan.outcome == 'success' &&
        contains(fromJSON('["0", "1", "2"]'), steps.plan.outputs.exitcode)
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PLAN_FILE: ${{ steps.plan.outputs.stdout_path }}
        PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        WORKING_DIR: ${{ inputs.working-directory }}
        TF_WORKSPACE: ${{ steps.plan.outputs.workspace }}
        SUMMARY_THEME: ${{ inputs.summary-theme }}
        COMMENT_NOTE: ${{ env.COMMENT_NOTE }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const { pathToFileURL } = require('url');
          const scriptPath = path.join('${{ github.action_path }}', 'dist', 'format-comment.js');
          const { default: script } = await import(pathToFileURL(scriptPath).href);
          await script({ github, context, core });

    - name: Check Plan Status
      if: >-
        !cancelled() && steps.plan.outcome != 'skipped' &&
        (steps.plan.outcome != 'success' ||
        !contains(fromJSON('["0", "2"]'), steps.plan.outputs.exitcode))
      shell: bash
      run: |
        echo "::error::Terraform plan failed"
        exit 1

    - name: Clean up temporary plan file
      if: always() && steps.plan.outputs.stdout_path != ''
      shell: bash
      env:
        PLAN_FILE: ${{ steps.plan.outputs.stdout_path }}
      run: rm -f "$PLAN_FILE"
